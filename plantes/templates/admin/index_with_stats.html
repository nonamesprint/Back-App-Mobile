{% extends "admin/index.html" %}

{% block content %}
<div style="margin-bottom: 20px; padding: 15px; background: #E8F5E9; border-radius: 8px; border-left: 4px solid #2E7D32;">
    <a href="{% url 'admin:stats' %}" style="font-size: 16px; font-weight: bold; color: #2E7D32; text-decoration: none;">
        📊 Voir les statistiques complètes
    </a>
    <span style="color: #666; margin-left: 10px; font-size: 14px;">
        - Réservations: {{ total_reservations }} | Circuits: {{ total_circuits }} | Plantes: {{ total_plantes }}
    </span>
</div>
{{ block.super }}
{% endblock %}
